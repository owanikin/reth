name: partial-state follower host tests

on:
  pull_request:
    paths:
      - scripts/partial-state-follower/**
      - .github/workflows/partial-state-follower.yml
  push:
    paths:
      - scripts/partial-state-follower/**
      - .github/workflows/partial-state-follower.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Test orchestration without Docker or a devnet
        run: python3 -m unittest discover -s scripts/partial-state-follower -p 'test_*.py' -v
